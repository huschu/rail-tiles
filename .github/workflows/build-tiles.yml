name: build-tiles

# Weekly full rebuild (incremental updates are deferred: at tens of MB a full
# rebuild is simpler and has no drift). Manual dispatch for on-demand runs.
on:
  schedule:
    - cron: "0 3 * * 1"        # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated region names to build instead of the whole world (smoke test), e.g. switzerland,japan,us-california"
        required: false
        default: ""

concurrency:
  group: build-tiles
  cancel-in-progress: false

permissions:
  contents: write               # create releases, upload assets

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
      tag: ${{ steps.stamp.outputs.tag }}
      build_id: ${{ steps.stamp.outputs.build_id }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          if [ -n "${{ github.event.inputs.regions }}" ]; then
            REGIONS=$(python3 pipeline/regions.py --names "${{ github.event.inputs.regions }}")
          else
            REGIONS=$(python3 pipeline/regions.py)
          fi
          echo "regions=$REGIONS" >> "$GITHUB_OUTPUT"
      - id: stamp
        run: |
          echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "build_id=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350          # under the 6 h job limit
    strategy:
      fail-fast: false            # one region failing must not poison the run
      matrix:
        region: ${{ fromJson(needs.prepare.outputs.regions) }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk for large extracts
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - uses: ./.github/actions/tippecanoe

      - name: Resolve extract hash (change detector)
        id: hash
        run: |
          # Geofabrik's .md5 sidecar is the content hash of the whole extract,
          # fetched without downloading the multi-GB file. It's the only hash
          # Geofabrik offers. When it's unreachable, fall back to a per-day key
          # so the region rebuilds rather than risking a stale cache hit.
          H=$(curl -sL --fail --retry 3 \
                "https://download.geofabrik.de/${{ matrix.region.path }}.md5" \
                | awk '{print $1}') || H=""
          if [ -z "$H" ]; then
            H="nohash-${{ needs.prepare.outputs.tag }}"
            echo "md5 unavailable; forcing rebuild with key $H"
          fi
          echo "md5=$H" >> "$GITHUB_OUTPUT"

      - name: Cache region tileset
        id: tiles
        uses: actions/cache@v6
        with:
          # Keyed by extract content: if the country's data is byte-identical to
          # a prior build, restore the finished tileset and skip fetch + filter +
          # tiling entirely. Any edit in the country busts the key and rebuilds.
          path: |
            work/${{ matrix.region.name }}.pmtiles
            work/${{ matrix.region.name }}.timestamp
          # Hash only the files that affect tile *content* (build + geometry), so
          # a change to join/manifest/verify does not needlessly rebuild every
          # region. An algorithm change here still busts the key.
          key: tiles-${{ matrix.region.name }}-${{ steps.hash.outputs.md5 }}-${{ hashFiles('pipeline/build_region.py', 'pipeline/classify.py', 'pipeline/geometry.py', 'pipeline/zoomparams.py') }}

      - name: Cache filtered extract
        id: extract
        if: steps.tiles.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            work/${{ matrix.region.name }}-rail.osm.pbf
            work/${{ matrix.region.name }}.timestamp
          key: extract-${{ matrix.region.name }}-${{ steps.hash.outputs.md5 }}

      - name: Fetch + filter
        if: steps.tiles.outputs.cache-hit != 'true' && steps.extract.outputs.cache-hit != 'true'
        run: bash scripts/fetch_region.sh "${{ matrix.region.name }}" "${{ matrix.region.path }}" work

      - name: Build tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        run: |
          python3 pipeline/build_region.py "${{ matrix.region.name }}" \
            "work/${{ matrix.region.name }}.pmtiles" \
            "work/${{ matrix.region.name }}-rail.osm.pbf"

      - name: Verify (gates 2-5)
        if: steps.tiles.outputs.cache-hit != 'true'
        run: |
          if [ -f "work/${{ matrix.region.name }}.pmtiles" ]; then
            python3 pipeline/verify.py "work/${{ matrix.region.name }}.pmtiles"
          else
            echo "no tileset (railless region); nothing to verify"
          fi

      - name: Reused cached tileset
        if: steps.tiles.outputs.cache-hit == 'true'
        run: echo "${{ matrix.region.name }} unchanged (md5 ${{ steps.hash.outputs.md5 }}); reused tileset, skipped rebuild"

      - uses: actions/upload-artifact@v7
        with:
          name: region-${{ matrix.region.name }}
          path: |
            work/${{ matrix.region.name }}.pmtiles
            work/${{ matrix.region.name }}.timestamp
          retention-days: 3

  join:
    needs: [prepare, build]
    # Run even if some regions failed, so a stray region does not block the whole
    # planet; assemble from whatever succeeded. Requires prepare to have produced
    # the matrix.
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tippecanoe

      - uses: actions/download-artifact@v8
        with:
          path: regions
          pattern: region-*

      - name: Join per continent
        id: join
        run: |
          shopt -s globstar nullglob
          PARTS=(regions/**/*.pmtiles)
          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "no region tilesets produced; nothing to join"; exit 1
          fi
          RESULT=$(python3 pipeline/join_planet.py regions out "${{ needs.prepare.outputs.tag }}")
          echo "$RESULT"
          OSM_TS=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)['osm_ts'])")
          echo "osm_ts=${OSM_TS:-${{ needs.prepare.outputs.build_id }}}" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Build manifest
        run: |
          python3 pipeline/manifest.py \
            --archives-dir out --tag "${{ needs.prepare.outputs.tag }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download" \
            --build-id "${{ needs.prepare.outputs.build_id }}" \
            --osm-timestamp "${{ steps.join.outputs.osm_ts }}" \
            --out manifest.json
          cat manifest.json

      # Only a full build (no region override) publishes to the production tag
      # and the stable manifest. A smoke run (regions input set) must never
      # clobber the live archives — it uploads a workflow artifact instead.
      - name: Publish dated archives
        if: github.event.inputs.regions == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Planet tiles $TAG" \
                 --notes "OSM railway PMTiles pyramid z4-z16, per-continent. Source as of ${{ steps.join.outputs.osm_ts }}."
          for f in out/*.pmtiles; do
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Publish manifest at the stable 'latest' tag
        if: github.event.inputs.regions == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "latest" \
                 --notes "Stable pointer. manifest.json names the current archives." --prerelease
          gh release upload latest manifest.json --clobber

      - name: Upload smoke build as artifact (no publish)
        if: github.event.inputs.regions != ''
        uses: actions/upload-artifact@v7
        with:
          name: smoke-build
          path: |
            out/*.pmtiles
            manifest.json
          retention-days: 3
