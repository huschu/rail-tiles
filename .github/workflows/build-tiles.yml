name: build-tiles

# Weekly full rebuild (incremental updates are deferred: at tens of MB a full
# rebuild is simpler and has no drift). Manual dispatch for on-demand runs.
on:
  schedule:
    - cron: "0 3 * * 1"        # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated region names to build instead of the whole world (smoke test), e.g. switzerland,japan,us-california"
        required: false
        default: ""

concurrency:
  group: build-tiles
  cancel-in-progress: false

permissions:
  contents: write               # create releases, upload assets

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
      tag: ${{ steps.stamp.outputs.tag }}
      build_id: ${{ steps.stamp.outputs.build_id }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          if [ -n "${{ github.event.inputs.regions }}" ]; then
            REGIONS=$(python3 pipeline/regions.py --names "${{ github.event.inputs.regions }}")
          else
            REGIONS=$(python3 pipeline/regions.py)
          fi
          echo "regions=$REGIONS" >> "$GITHUB_OUTPUT"
      - id: stamp
        run: |
          echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "build_id=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350          # under the 6 h job limit
    # A region never reds the run: transient drops carry forward last good data,
    # and the join's coverage gate reds the run only on a broad outage.
    continue-on-error: true
    strategy:
      fail-fast: false            # one region failing must not cancel the others
      matrix:
        region: ${{ fromJson(needs.prepare.outputs.regions) }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk for large extracts
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - uses: ./.github/actions/tippecanoe

      - name: Resolve extract hash (change detector)
        id: hash
        run: |
          # Geofabrik's .md5 sidecar is the content hash of the whole extract,
          # fetched without downloading the multi-GB file. When it's unreachable,
          # fall back to a per-day key so the region rebuilds.
          H=$(curl -sL --fail --retry 3 \
                "https://download.geofabrik.de/${{ matrix.region.path }}.md5" \
                | awk '{print $1}') || H=""
          if [ -z "$H" ]; then
            H="nohash-${{ needs.prepare.outputs.tag }}"
            echo "md5 unavailable; forcing rebuild with key $H"
          fi
          echo "md5=$H" >> "$GITHUB_OUTPUT"

      - name: Restore region tileset
        id: tiles
        uses: actions/cache/restore@v6
        with:
          # Exact key = byte-identical extract AND same build code -> reuse as is.
          # restore-keys falls back to the newest prior tileset for this region
          # (last known good), which the build step carries forward if the fresh
          # build is unavailable, so a dropped region is stale, never blank.
          path: |
            work/${{ matrix.region.name }}.pmtiles
            work/${{ matrix.region.name }}.timestamp
          key: tiles-${{ matrix.region.name }}-${{ steps.hash.outputs.md5 }}-${{ hashFiles('pipeline/build_region.py', 'pipeline/classify.py', 'pipeline/geometry.py', 'pipeline/zoomparams.py', 'scripts/fetch_region.sh') }}
          restore-keys: |
            tiles-${{ matrix.region.name }}-

      - name: Restore filtered extract
        id: extract
        if: steps.tiles.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            work/${{ matrix.region.name }}-rail.osm.pbf
            work/${{ matrix.region.name }}.timestamp
          key: extract-${{ matrix.region.name }}-${{ steps.hash.outputs.md5 }}-${{ hashFiles('scripts/fetch_region.sh') }}

      - name: Build or carry forward
        id: build
        if: steps.tiles.outputs.cache-hit != 'true'
        env:
          NAME: ${{ matrix.region.name }}
          PATHREL: ${{ matrix.region.path }}
        run: |
          set -uo pipefail
          NEW="work/$NAME.new.pmtiles"
          if [ ! -f "work/$NAME-rail.osm.pbf" ]; then
            bash scripts/fetch_region.sh "$NAME" "$PATHREL" work || true
          fi
          if [ -f "work/$NAME-rail.osm.pbf" ]; then
            if python3 pipeline/build_region.py "$NAME" "$NEW" "work/$NAME-rail.osm.pbf"; then
              if [ ! -f "$NEW" ]; then
                rm -f "work/$NAME.pmtiles"          # railless region: legitimately empty
                echo "$NAME: no railways"; exit 0
              fi
              if python3 pipeline/verify.py "$NEW"; then
                mv "$NEW" "work/$NAME.pmtiles"
                echo "built=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::warning::$NAME: gates failed on fresh build"
            else
              echo "::warning::$NAME: build failed on fresh extract"
            fi
            rm -f "$NEW"
          else
            echo "::warning::$NAME: download failed on both mirrors"
          fi
          if [ -f "work/$NAME.pmtiles" ]; then
            echo "::warning::$NAME: carrying forward last good tileset"; exit 0
          fi
          echo "::error::$NAME: no fresh build and no prior tileset"; exit 1

      - name: Save region tileset            # only a fresh build, under the exact key
        if: steps.build.outputs.built == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            work/${{ matrix.region.name }}.pmtiles
            work/${{ matrix.region.name }}.timestamp
          key: tiles-${{ matrix.region.name }}-${{ steps.hash.outputs.md5 }}-${{ hashFiles('pipeline/build_region.py', 'pipeline/classify.py', 'pipeline/geometry.py', 'pipeline/zoomparams.py', 'scripts/fetch_region.sh') }}

      - name: Upload region tileset          # skipped only when the region hard-failed
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: region-${{ matrix.region.name }}
          path: |
            work/${{ matrix.region.name }}.pmtiles
            work/${{ matrix.region.name }}.timestamp
          if-no-files-found: ignore
          retention-days: 3

  join:
    needs: [prepare, build]
    # Run even if some regions failed, so a stray region does not block the whole
    # planet; assemble from whatever succeeded. Requires prepare to have produced
    # the matrix.
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tippecanoe

      - uses: actions/download-artifact@v8
        with:
          path: regions
          pattern: region-*

      - name: Coverage gate
        # Green when a handful of regions drop (each carried forward as stale, or
        # genuinely absent); red only on a broad outage. A region has an artifact
        # unless it hard-failed with no prior tileset to carry forward.
        env:
          REGIONS: ${{ needs.prepare.outputs.regions }}
        run: |
          python3 - <<'PY'
          import json, os, glob
          expected = {r["name"] for r in json.loads(os.environ["REGIONS"])}
          present = {os.path.basename(d)[len("region-"):]
                     for d in glob.glob("regions/region-*") if os.path.isdir(d)}
          missing = sorted(expected - present)
          print(f"regions handled: {len(present)}/{len(expected)}")
          if missing:
              print("::warning title=Regions dropped::" + ", ".join(missing))
          allowed = 5
          if len(missing) > allowed:
              raise SystemExit(f"::error::{len(missing)} regions missing (> {allowed}); likely an outage")
          PY

      - name: Join per continent
        id: join
        run: |
          shopt -s globstar nullglob
          PARTS=(regions/**/*.pmtiles)
          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "no region tilesets produced; nothing to join"; exit 1
          fi
          RESULT=$(python3 pipeline/join_planet.py regions out "${{ needs.prepare.outputs.tag }}")
          echo "$RESULT"
          OSM_TS=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)['osm_ts'])")
          echo "osm_ts=${OSM_TS:-${{ needs.prepare.outputs.build_id }}}" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Build manifest
        run: |
          python3 pipeline/manifest.py \
            --archives-dir out --tag "${{ needs.prepare.outputs.tag }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download" \
            --build-id "${{ needs.prepare.outputs.build_id }}" \
            --osm-timestamp "${{ steps.join.outputs.osm_ts }}" \
            --out manifest.json
          cat manifest.json

      # Only a full build (no region override) publishes to the production tag
      # and the stable manifest. A smoke run (regions input set) must never
      # clobber the live archives — it uploads a workflow artifact instead.
      - name: Publish dated archives
        if: github.event.inputs.regions == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Planet tiles $TAG" \
                 --notes "OSM railway PMTiles pyramid z4-z16, per-continent. Source as of ${{ steps.join.outputs.osm_ts }}."
          for f in out/*.pmtiles; do
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Publish manifest at the stable 'latest' tag
        if: github.event.inputs.regions == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "latest" \
                 --notes "Stable pointer. manifest.json names the current archives." --prerelease
          gh release upload latest manifest.json --clobber

      - name: Upload smoke build as artifact (no publish)
        if: github.event.inputs.regions != ''
        uses: actions/upload-artifact@v7
        with:
          name: smoke-build
          path: |
            out/*.pmtiles
            manifest.json
          retention-days: 3
