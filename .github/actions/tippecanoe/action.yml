name: Install tippecanoe
description: Build tippecanoe (and tile-join, tippecanoe-decode) from source, cached by version.
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        # List every installed binary. A glob like tippecanoe* silently drops
        # tile-join, which then vanishes on a cache hit.
        path: |
          /usr/local/bin/tippecanoe
          /usr/local/bin/tile-join
          /usr/local/bin/tippecanoe-decode
          /usr/local/bin/tippecanoe-json-tool
          /usr/local/bin/tippecanoe-enumerate
          /usr/local/bin/tippecanoe-overzoom
        key: tippecanoe-${{ env.TIPPECANOE_VERSION || '2.79.0' }}-${{ runner.os }}-v2
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        VER="${TIPPECANOE_VERSION:-2.79.0}"
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev git
        git clone --depth 1 --branch "$VER" https://github.com/felt/tippecanoe /tmp/tippecanoe
        make -C /tmp/tippecanoe -j"$(nproc)"
        sudo make -C /tmp/tippecanoe install
    - shell: bash
      run: |
        set -e
        tippecanoe --version
        command -v tile-join
        command -v tippecanoe-decode
